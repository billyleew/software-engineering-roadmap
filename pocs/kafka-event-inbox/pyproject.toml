[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eli-event-inbox-poc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
inbox = "event_inbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
