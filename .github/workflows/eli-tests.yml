name: ELI unit and integration tests
on:
  push:
    paths:
      - 'learning-intelligence/**'
      - '.github/workflows/eli-tests.yml'
  pull_request:
    paths:
      - 'learning-intelligence/**'
      - '.github/workflows/eli-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e './learning-intelligence[test]'
      - name: Run tests
        run: python -m pytest -q learning-intelligence/tests
