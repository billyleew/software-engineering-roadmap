[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-learning-intelligence"
version = "0.1.0"
description = "Source-grounded engineering research inbox"
requires-python = ">=3.11"
dependencies = ["feedparser>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
eli = "eli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
